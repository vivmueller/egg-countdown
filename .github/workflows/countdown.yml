name: Update Countdown SVG

on:
  schedule:
    # Runs every 5 minutes
    # Note: GitHub may delay scheduled runs by a few minutes under load
    - cron: "*/5 * * * *"
  workflow_dispatch:  # Allow manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed to commit the SVG back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate SVG
        run: python generate_countdown.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add countdown.svg
          # Only commit if the file actually changed
          git diff --cached --quiet || git commit -m "Update countdown SVG"
          git push
